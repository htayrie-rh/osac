# kind cluster configuration for the full OSAC development environment.
# Usage: make install PLATFORM=kind PROFILE=dev-full
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: osac-dev
nodes:
  - role: control-plane
    extraPortMappings:
      # Keep dev-full's host ports separate from the rootless PROFILE=dev cluster.
      # Envoy Gateway ingress (HTTPS) — mapped to NodePort 30443.
      - containerPort: 30443
        hostPort: 28443
        listenAddress: 127.0.0.1
        protocol: TCP
      # Envoy Gateway ingress (HTTP) — mapped to NodePort 30080.
      - containerPort: 30080
        hostPort: 28080
        listenAddress: 127.0.0.1
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            # Allow TokenReview from Authorino
            service-account-issuer: https://kubernetes.default.svc
            service-account-signing-key-file: /etc/kubernetes/pki/sa.key
